site_name: Economie
site_description: >-
  Long-form, data-driven analyses of economies, built from public
  statistics. Every chart is generated by code and every figure is
  traceable to its source.
site_author: Mihai Gociu
site_url: https://mihaigociu.github.io/economie/
repo_url: https://github.com/mihaigociu/economie
repo_name: mihaigociu/economie
edit_uri: ""
copyright: >-
  Text and charts © Mihai Gociu, licensed CC BY 4.0. Data from the
  public sources cited in each report.

docs_dir: site-src
site_dir: site

# Each report folder is symlinked into site-src/reports/. Publish only the
# report itself and its charts — not scripts, plans, raw data or drafts.
exclude_docs: |
  /reports/*/*
  !/reports/*/report.md
  !/reports/*/charts/

nav:
  - Home: index.md
  - Reports:
      - Romania: reports/romania/report.md
      - Greece: reports/greece/report.md
      - Romanian IT sector: reports/it-romania/report.md
      - China's industrial rise: reports/china/report.md
  - About: about.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search
  - glightbox:
      skip_classes:
        - no-lightbox

hooks:
  - hooks/reports.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  # The reports escape dollar signs as \$ (GitHub renders that as "$");
  # escapeall makes Python-Markdown do the same.
  - pymdownx.escapeall
  - toc:
      permalink: true
      # GitHub-style heading IDs, so in-report anchor links keep working.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn
